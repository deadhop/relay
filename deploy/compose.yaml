# deadhop relay with Docker Compose. Build from the repository root:
#   docker compose -f deploy/compose.yaml up -d --build
# Set DEADHOP_RELAY_WHITELIST (or DEADHOP_RELAY_PUBLIC=on) in a .env file next to
# this one, or in the shell. The relay refuses to start with neither.
services:
  relay:
    build:
      context: ..
    image: deadhop-relay
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    # Empty values mean the relay's defaults (see the configuration docs).
    environment:
      DEADHOP_RELAY_WHITELIST: ${DEADHOP_RELAY_WHITELIST:-}
      DEADHOP_RELAY_PUBLIC: ${DEADHOP_RELAY_PUBLIC:-}
      DEADHOP_RELAY_PUBLIC_URLS: ${DEADHOP_RELAY_PUBLIC_URLS:-}
      # Behind a reverse proxy, believe its X-Forwarded-For.
      DEADHOP_RELAY_TRUSTED_PROXIES: ${DEADHOP_RELAY_TRUSTED_PROXIES:-}
      DEADHOP_RELAY_NAME: ${DEADHOP_RELAY_NAME:-}
      DEADHOP_RELAY_MAX_CONNECTIONS: ${DEADHOP_RELAY_MAX_CONNECTIONS:-}
      DEADHOP_RELAY_RESERVED_CONNECTIONS: ${DEADHOP_RELAY_RESERVED_CONNECTIONS:-}
      DEADHOP_RELAY_CONNECTIONS_PER_IP: ${DEADHOP_RELAY_CONNECTIONS_PER_IP:-}
      DEADHOP_RELAY_MESSAGES_PER_SEC: ${DEADHOP_RELAY_MESSAGES_PER_SEC:-}
      DEADHOP_RELAY_PUBLIC_EVENTS_PER_MIN: ${DEADHOP_RELAY_PUBLIC_EVENTS_PER_MIN:-}
      DEADHOP_RELAY_PUBLIC_MAX_EVENT_BYTES: ${DEADHOP_RELAY_PUBLIC_MAX_EVENT_BYTES:-}
      DEADHOP_RELAY_OPEN_MAX_EVENT_BYTES: ${DEADHOP_RELAY_OPEN_MAX_EVENT_BYTES:-}
      DEADHOP_RELAY_OPEN_STORE_MAX_EVENTS: ${DEADHOP_RELAY_OPEN_STORE_MAX_EVENTS:-}
      DEADHOP_RELAY_MIN_POW: ${DEADHOP_RELAY_MIN_POW:-}
      DEADHOP_RELAY_HOLD_SECS: ${DEADHOP_RELAY_HOLD_SECS:-}
      DEADHOP_RELAY_ALLOW_PROBE: ${DEADHOP_RELAY_ALLOW_PROBE:-}
      # Tor, I2P, FIPS (see the docs). Point your daemon at these listeners on
      # this container's network; do not publish their ports to the host.
      DEADHOP_RELAY_TOR_LISTEN: ${DEADHOP_RELAY_TOR_LISTEN:-}
      DEADHOP_RELAY_TOR_URLS: ${DEADHOP_RELAY_TOR_URLS:-}
      DEADHOP_RELAY_TOR_DAEMONS: ${DEADHOP_RELAY_TOR_DAEMONS:-}
      DEADHOP_RELAY_I2P_LISTEN: ${DEADHOP_RELAY_I2P_LISTEN:-}
      DEADHOP_RELAY_I2P_URLS: ${DEADHOP_RELAY_I2P_URLS:-}
      DEADHOP_RELAY_I2P_DAEMONS: ${DEADHOP_RELAY_I2P_DAEMONS:-}
      DEADHOP_RELAY_FIPS_LISTEN: ${DEADHOP_RELAY_FIPS_LISTEN:-}
      DEADHOP_RELAY_FIPS_URLS: ${DEADHOP_RELAY_FIPS_URLS:-}
    ports:
      - "7447:7447"
      # The operator page has no sign-in: publish it to the host's loopback only.
      - "127.0.0.1:7448:7448"
