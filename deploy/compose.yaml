# deadhop relay with Docker Compose. Build from the repository root:
#   docker compose -f relay/deploy/compose.yaml up -d --build
# Set DEADHOP_RELAY_WHITELIST in a .env file next to this one, or in the shell.
services:
  relay:
    build:
      context: ../..
      dockerfile: relay/Dockerfile
    image: deadhop-relay
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    # Empty values mean the relay's defaults (see the configuration docs).
    environment:
      DEADHOP_RELAY_WHITELIST: ${DEADHOP_RELAY_WHITELIST:?list your deadhop invoice and/or admin keys}
      DEADHOP_RELAY_PUBLIC_URLS: ${DEADHOP_RELAY_PUBLIC_URLS:-}
      # Behind a reverse proxy, believe its X-Forwarded-For.
      DEADHOP_RELAY_TRUSTED_PROXIES: ${DEADHOP_RELAY_TRUSTED_PROXIES:-}
      DEADHOP_RELAY_NAME: ${DEADHOP_RELAY_NAME:-}
      DEADHOP_RELAY_MAX_CONNECTIONS: ${DEADHOP_RELAY_MAX_CONNECTIONS:-}
      DEADHOP_RELAY_RESERVED_CONNECTIONS: ${DEADHOP_RELAY_RESERVED_CONNECTIONS:-}
      DEADHOP_RELAY_CONNECTIONS_PER_IP: ${DEADHOP_RELAY_CONNECTIONS_PER_IP:-}
      DEADHOP_RELAY_MESSAGES_PER_SEC: ${DEADHOP_RELAY_MESSAGES_PER_SEC:-}
      DEADHOP_RELAY_PUBLIC_EVENTS_PER_MIN: ${DEADHOP_RELAY_PUBLIC_EVENTS_PER_MIN:-}
      DEADHOP_RELAY_PUBLIC_MAX_EVENT_BYTES: ${DEADHOP_RELAY_PUBLIC_MAX_EVENT_BYTES:-}
      DEADHOP_RELAY_MIN_POW: ${DEADHOP_RELAY_MIN_POW:-}
      DEADHOP_RELAY_HOLD_SECS: ${DEADHOP_RELAY_HOLD_SECS:-}
      DEADHOP_RELAY_ALLOW_PROBE: ${DEADHOP_RELAY_ALLOW_PROBE:-}
    ports:
      - "7447:7447"
      # The operator page has no sign-in: publish it to the host's loopback only.
      - "127.0.0.1:7448:7448"
