[package]
name = "deadhop-relay"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A small Nostr relay that carries only deadhop's ContextVM traffic, for the keys you whitelist"
license = "MIT"

[[bin]]
name = "deadhop-relay"
path = "src/bin/deadhop-relay.rs"

[dependencies]
bech32 = "0.11"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
getrandom = "0.3"
hex = "0.4"
httparse = "1.10"
secp256k1 = { version = "0.29", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }

[dev-dependencies]
nostr-sdk = "0.44"
proptest = { version = "1", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
